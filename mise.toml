# Pinned tools and tasks for this repo. `mise install`, then `mise tasks` lists what you can run.
[tools]
node = "22"
pnpm = "10"
jq = "1.7"

[tasks.apidiff]
description = "Ask GitHub and Diffinery the same API questions and list the differences (needs DIFFINERY_TOKEN)"
run = "node scripts/apidiff.mjs all"

[tasks."apidiff:github"]
description = "Fetch only GitHub's answers"
run = "node scripts/apidiff.mjs fetch github"

[tasks."apidiff:diffinery"]
description = "Fetch only Diffinery's answers (needs DIFFINERY_TOKEN)"
run = "node scripts/apidiff.mjs fetch diffinery"

[tasks."apidiff:compare"]
description = "Compare the saved answers in results/latest"
run = "node scripts/apidiff.mjs compare"

[tasks."twin:sync"]
description = "Make the Diffinery twin identical to this GitHub repo; GitHub wins (needs DIFFINERY_TOKEN)"
run = "scripts/sync-twin.sh"

[tasks."ghcheck:diffinery"]
description = "Run the gh command checks (reads and writes) against the Diffinery twin"
run = "scripts/ghcheck.sh ${DIFFINERY_HOST:-diffinery.ubuntusoftware.net}/${DIFFINERY_REPO:-gedw99/diffinery-bench}"

[tasks."ghcheck:github"]
description = "Run the same gh checks against this GitHub repo (from a normal gh login; Claude sessions block GitHub GraphQL)"
run = "scripts/ghcheck.sh github.com/${GH_REPO:-joeblew999/diffinery-bench}"

[tasks.check]
description = "Full check: sync the twin, then compare APIs and run the gh checks against Diffinery"
depends = ["twin:sync"]
run = ["node scripts/apidiff.mjs all", "scripts/ghcheck.sh ${DIFFINERY_HOST:-diffinery.ubuntusoftware.net}/${DIFFINERY_REPO:-gedw99/diffinery-bench}"]

[tasks."check:self"]
description = "Inside CI on either platform: test this platform against itself (API answers + read-only gh checks) into results/latest"
run = """
node scripts/apidiff.mjs fetch self
host="${GITHUB_SERVER_URL#https://}"
if [ "$host" != "github.com" ]; then export GH_HOST="$host"; fi
GHCHECK_READONLY=1 scripts/ghcheck.sh "$host/$GITHUB_REPOSITORY" | tee results/latest/ghcheck.md
"""

[tasks."twin:collect"]
description = "Download both twins' latest check results and compare them side by side (needs gh and DIFFINERY_TOKEN)"
run = "scripts/twin-collect.sh"

[tasks."diffinery:up"]
description = "Deploy Diffinery to Cloudflare, including DNS, Email Sending, Turnstile and Access (needs CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DIFFINERY_DOMAIN, BOOTSTRAP_ADMINS, Docker)"
run = "scripts/diffinery-up.sh"

[tasks."diffinery:down"]
description = "List everything Diffinery created on Cloudflare; pass --yes to delete it all"
run = "scripts/diffinery-down.sh"
